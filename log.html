<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sound Stickers for Web Chat: Log</title>
    <style>
      body {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px;
        font:
          14px "Segoe UI",
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        background: #ffffff;
        color: #111b21;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111b21;
          color: #e9edef;
        }
        #log {
          background: #202c33 !important;
        }
        button {
          border-color: #2a3942 !important;
        }
        button:hover {
          background: #2a3942;
        }
      }
      h1 {
        font-size: 19px;
        font-weight: 400;
        margin: 0 0 6px;
      }
      #hint,
      #summary {
        color: #667781;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin: 10px 0;
        flex-wrap: wrap;
      }
      button {
        padding: 6px 14px;
        border-radius: 16px;
        border: 1px solid #e9edef;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
      }
      button:hover {
        background: #f5f6f6;
      }
      button.main {
        background: #00a884;
        color: #fff;
        border: none;
        border-radius: 24px;
        padding: 8px 20px;
        font-weight: 500;
      }
      button.main:hover {
        background: #008f72;
      }
      #log {
        height: calc(100vh - 170px);
        overflow: auto;
        font:
          11.5px/1.4 ui-monospace,
          Consolas,
          monospace;
        background: #f0f2f5;
        padding: 8px 10px;
        border-radius: 8px;
        white-space: pre-wrap;
      }
      .e {
        color: #ea0038;
      }
      .w {
        color: #b7791f;
      }
    </style>
  </head>
  <body>
    <h1 id="title">Sound Stickers for Web Chat: Log</h1>
    <div id="hint" style="font-size: 12px; margin-bottom: 6px">
      If something goes wrong, download the log to inspect or share when reporting an issue. Phone
      numbers and IDs are masked.
    </div>
    <div id="summary">Loading...</div>
    <div class="row">
      <button class="main" id="dl">Download log (.json)</button>
      <button id="copy">Copy</button>
      <button id="errors">Errors only</button>
      <button id="clear">Clear log</button>
    </div>
    <div id="log"></div>
    <script src="log.js"></script>
  </body>
</html>
